[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbsnp-liftover"
version = "0.1.0"
description = "GWAS variant coordinate mapping between dbSNP assembly snapshots"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dbsnp-liftover = "dbsnp_liftover.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
